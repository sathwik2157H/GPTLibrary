services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: gptlibrary-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: gptlibrary
      POSTGRES_USER: gptuser
      POSTGRES_PASSWORD: gptpassword
    ports:
      - "5432:5432"
    volumes:
      - gptlibrary_pgdata:/var/lib/postgresql/data
      - ./docker/init-db:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gptuser -d gptlibrary"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

volumes:
  gptlibrary_pgdata:
    name: gptlibrary_pgdata
